[package]
name = "vibe-model"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "@todo"
repository = "https://gitcode.com/keygenqt_vz/vibe-model"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru"]
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap-cargo = "0.18"
colored = "3.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1.3"
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vibe-cluster = "0.0.2"
rusqlite = "0.39.0"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures = "0.3"
tokio-stream = "0.1"
regex = "1.10"
async-trait = "0.1.89"
